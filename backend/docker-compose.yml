
services:

  db:
    image: postgres:16
    container_name: siteguard-db

    environment:
      POSTGRES_DB: siteguard_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d siteguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: siteguard-backend

    ports:
      - "8004:8004"

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/siteguard_db

    volumes:
      - uploads_data:/app/backend/uploads

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "python create_tables.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8004"

    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
